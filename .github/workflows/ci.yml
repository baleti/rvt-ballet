name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install aiohttp numpy scipy olefile pillow shapely mapbox-earcut matplotlib fonttools pytest
      # synthetic geometry unit tests only (no Autodesk samples in CI); the app must at least import on every OS
      - run: python -m pytest -q tests/test_geom.py
      - run: python -c "import rvtballet.plat, rvtballet.filebrowse, rvtballet.cli; print('imports ok')"
      # save path without savegate / write-lab (not available in CI): modules import, saves degrade to 'unavailable' (501), no tracebacks
      - run: python -c "import rvtballet.save, rvtballet.edit; print('save imports ok')"
      - run: python tests/test_save.py
      - run: python tests/test_save_nosavegate.py
  installer-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "installer build needs the reader and sheets checkouts (private); built locally via packaging/build_windows_rvt.ps1"
  macos-package-smoke:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: droplet compiles, Info.plist merges, ad-hoc signature verifies (no app code needed)
        run: |
          set -e
          sh -n packaging/macos/build_macos.sh
          osacompile -o /tmp/t.app packaging/macos/launcher.applescript
          python3 - /tmp/t.app/Contents/Info.plist packaging/macos/Info.plist <<'P'
          import plistlib, sys
          d = plistlib.load(open(sys.argv[1], 'rb')); s = plistlib.load(open(sys.argv[2], 'rb'))
          for k in ('CFBundleDocumentTypes', 'UTImportedTypeDeclarations', 'CFBundleIdentifier'): d[k] = s[k]
          plistlib.dump(d, open(sys.argv[1], 'wb'))
          P
          codesign --force --deep -s - /tmp/t.app
          codesign --verify --deep --strict /tmp/t.app && echo signature ok
  linux-integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: per-user .desktop + MIME install and uninstall
        run: |
          D=$(mktemp -d); mkdir -p bin; printf '#!/bin/sh\n' > bin/rvt-ballet; chmod +x bin/*
          XDG_DATA_HOME=$D sh packaging/linux/install.sh
          test -f $D/applications/*.desktop && test -f $D/mime/packages/*.xml
          XDG_DATA_HOME=$D sh packaging/linux/install.sh --uninstall
          test -z "$(ls $D/applications)"
